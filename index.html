<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>University Learning Management Portal</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        header { background: #003366; color: white; padding: 15px; text-align: center; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 30%; }
        h2 { color: #003366; }
    </style>
</head>
<body>
    <header><h1>University Learning Management Portal (v1.0)</h1></header>
    <div class="container">
        <div class="card"><h2>Course Information</h2><p>CS101: Introduction to DevOps</p></div>
        <div class="card"><h2>Faculty Profiles</h2><p>Dr. Jane Doe - Cloud Architecture</p></div>
        <div class="card"><h2>Learning Resources</h2><p>Lecture 1: CI/CD Fundamentals</p></div>
    </div>
</body>
</html>
